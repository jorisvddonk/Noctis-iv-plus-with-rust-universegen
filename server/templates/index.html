<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctis IV Visual Verifier</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #ddd; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 1rem; }
  h1 { color: #8cf; }
  a { color: #8cf; text-decoration: none; }
  a:hover { text-decoration: underline; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: .4rem .6rem; text-align: left; border-bottom: 1px solid #333; }
  th { background: #1a1a2e; color: #8cf; position: sticky; top: 0; }
  tr:hover { background: #1a1a2e; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: .75rem; font-weight: bold; }
  .cls-S00 { background:#4af; } .cls-S01 { background:#4a8; } .cls-S02 { background:#4a4; }
  .cls-S03 { background:#8a4; } .cls-S04 { background:#a84; } .cls-S05 { background:#a44; }
  .cls-S07 { background:#84a; } .cls-S08 { background:#48a; } .cls-S09 { background:#448; }
  .cls-S10 { background:#666; } .cls-S11 { background:#888; }
  .ok { color:#4a4; } .mismatch { color:#a44; }
  .detail { display: none; }
  .detail.open { display: block; }
  .detail-inner { padding: 1rem; background: #1a1a2e; border-radius: 8px; margin: .5rem 0; }
  .planets { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .5rem; }
  .planet-card { background: #222; border-radius: 8px; padding: .5rem; }
  .planet-card h4 { margin: 0 0 .25rem 0; }
  .images { display: flex; flex-wrap: wrap; gap: 4px; margin: .5rem 0; }
  .images img { border: 1px solid #444; border-radius: 4px; max-width: 100%; cursor: zoom-in; image-rendering: auto; }
  .images .label { font-size: .7rem; color: #888; text-align: center; }
  .thumb-link { cursor: pointer; }
  .thumb-link:hover { border-color: #8cf; }
  input, select { background: #333; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px; }
  .landing-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
  .landing-form label { color: #888; }
  .match-info { font-size: .8rem; }
  .gap-warn { color: #a84; }
  #lightbox { display: none; position: fixed; z-index: 999; inset: 0; background: rgba(0,0,0,.85); justify-content: center; align-items: center; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { width: 95vw; height: 95vh; object-fit: contain; image-rendering: pixelated; box-shadow: 0 0 40px #000; }
  #report { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
  .stat-card { background: #1a1a2e; border-radius: 6px; padding: .5rem 1rem; min-width: 100px; text-align: center; }
  .stat-card .num { font-size: 1.4rem; font-weight: bold; }
  .stat-card .lbl { font-size: .7rem; color: #888; }
</style>
</head>
<body>
<div id="lightbox" onclick="this.classList.remove('open')"><img id="lb-img"></div>
<body>
<div class="wrap">
<h1>Noctis IV · Visual Verifier</h1>
<div id="report">Loading…</div>
<div id="mismatches"></div>
<p style="color:#888">
  {{ stars|length }} stars in DB. Click a row to expand.
</p>

<table>
<thead><tr>
  <th>Star</th><th>Class</th><th>Coord (x y z)</th><th>Bodies</th><th>Status</th>
</tr></thead>
<tbody>
{% for s in stars %}
<tr class="star-row" onclick="toggle('{{ s.id }}', '{{ s.name|e }}')">
  <td><strong>{{ s.name }}</strong></td>
  <td><span class="badge cls-S{{ '%02d' % s.class }}">S{{ '%02d' % s.class }}</span></td>
  <td style="font-size:.8rem;color:#888">{{ '%.0f %.0f %.0f'|format(s.x, s.y_user, s.z) }}</td>
  <td>{{ s.nob }}</td>
  <td id="status-{{ s.id }}">…</td>
</tr>
<tr id="star-{{ s.id }}" class="detail">
  <td colspan="5"><div class="detail-inner" id="detail-{{ s.id }}">Loading…</div></td>
</tr>
{% endfor %}
</tbody>
</table>
</div>

<script>
function zoom(el) { document.getElementById('lb-img').src = el.src; document.getElementById('lightbox').classList.add('open'); }

async function toggle(id, name) {
  const el = document.getElementById('star-' + id);
  const open = el.classList.toggle('open');
  if (open) {
    loadStar(id, name);
  }
}

function selLon(name, body) {
  const lon = document.getElementById(`lon-${name}-${body}`).value;
  const lat = document.getElementById(`lat-${name}-${body}`).value;
  document.getElementById(`sector-img-${name}-${body}`).src =
    `/stars/${encodeURIComponent(name)}/bodies/${body}/sector.png?lon=${lon}&lat=${lat}`;
}
function selStex(name, body) {
  const lon = document.getElementById(`stex-lon-${name}-${body}`).value;
  const lat = document.getElementById(`stex-lat-${name}-${body}`).value;
  document.getElementById(`stex-img-${name}-${body}`).src =
    `/stars/${encodeURIComponent(name)}/bodies/${body}/surftex.png?lon=${lon}&lat=${lat}`;
}

async function loadStar(id, name) {
  const res = await fetch(`/api/stars/${encodeURIComponent(name)}`);
  const data = await res.json();
  const star = data.star;
  const planets = data.planets;

  let html = `<div class="planets">`;
  for (const p of planets) {
    const ptype = p.planet_type;
    const desc = {0:"Internally hot",1:"Dusty",2:"Thick atmosphere",3:"Felisian",4:"Rocky creased",5:"Thin atmosphere",6:"Gas giant",7:"Icy",8:"Quartz",9:"Substellar object",10:"Companion star"}[ptype] || "?";
    const moon = p.is_moon ? " ☾" : "";
    const defOk = p.rust_sect_def_hm && p.rust_sect_def_hm === p.sect_def_hm ? "ok" : "mismatch";
    const randOk = p.rust_sect_rand_hm && p.rust_sect_rand_hm === p.sect_rand_hm ? "ok" : "mismatch";
    html += `<div class="planet-card" id="card-${name}-${p.body_index}">`;
    html += `<h4>#${p.body_index}${p.name ? ' ' + p.name : ''}  (${desc})${moon}</h4>`;
    html += `<div class="match-info">`;
    if (p.surf_fnv) {
      const surfOk = p.rust_surf_fnv === p.surf_fnv ? "ok" : "mismatch";
      html += `<span class="${surfOk}">surf ${surfOk}</span> · `;
      const palOk = p.rust_pal_fnv === p.pal_fnv ? "ok" : "mismatch";
      html += `<span class="${palOk}">pal ${palOk}</span> · `;
    }
    html += `<span class="${defOk}">def ${defOk}</span> · <span class="${randOk}">rand ${randOk}</span>`;
    const skyOk = p.rust_sky_texture && p.rust_sky_texture === p.sky_texture ? "ok" : p.sky_texture ? "mismatch" : "";
    const stexOk = p.rust_surftex && p.rust_surftex === p.canon_surftex ? "ok" : p.canon_surftex ? "mismatch" : "";
    if (skyOk) { html += ` · <span class="${skyOk}">sky ${skyOk}</span>`; }
    if (stexOk) { html += ` · <span class="${stexOk}">stex ${stexOk}</span>`; }
    html += `</div>`;
    html += `<div class="images">`;
    html += `<div><div class="label">Surface</div>`;
    html += `<img src="/stars/${encodeURIComponent(name)}/bodies/${p.body_index}/surface.png?lon=0&lat=60" loading="lazy" width="180" height="90" onclick="zoom(this)">`;
    html += `</div>`;
    html += `<div><div class="label">Sector</div>`;
    html += `<img id="sector-img-${name}-${p.body_index}" src="/stars/${encodeURIComponent(name)}/bodies/${p.body_index}/sector.png?lon=21&lat=87" loading="lazy" width="200" height="200" onclick="zoom(this)">`;
    html += `<div class="landing-form">`;
    html += `<label>lon</label><input id="lon-${name}-${p.body_index}" type="number" value="21" size="3" onchange="selLon('${name}',${p.body_index})">`;
    html += `<label>lat</label><input id="lat-${name}-${p.body_index}" type="number" value="87" size="3" onchange="selLon('${name}',${p.body_index})">`;
    html += `</div></div>`;
    html += `<div><div class="label">SurfTex</div>`;
    html += `<img id="stex-img-${name}-${p.body_index}" src="/stars/${encodeURIComponent(name)}/bodies/${p.body_index}/surftex.png?lon=21&lat=87" loading="lazy" width="128" height="128" onclick="zoom(this)">`;
    html += `<div class="landing-form">`;
    html += `<label>lon</label><input id="stex-lon-${name}-${p.body_index}" type="number" value="21" size="3" onchange="selStex('${name}',${p.body_index})">`;
    html += `<label>lat</label><input id="stex-lat-${name}-${p.body_index}" type="number" value="87" size="3" onchange="selStex('${name}',${p.body_index})">`;
    html += `</div></div>`;
    html += `<div><div class="label">Palette</div>`;
    html += `<img src="/stars/${encodeURIComponent(name)}/bodies/${p.body_index}/palette.png?lon=0&lat=60" loading="lazy" width="256" height="32" onclick="zoom(this)">`;
    html += `</div>`;
    html += `<div><div class="label">Atmo</div>`;
    html += `<img src="/stars/${encodeURIComponent(name)}/bodies/${p.body_index}/atmo.png?lon=0&lat=60" loading="lazy" width="180" height="90" onclick="zoom(this)">`;
    html += `</div>`;
    html += `</div>`; // images
    html += `</div>`; // card
  }
  html += `</div>`; // planets

  document.getElementById(`detail-${id}`).innerHTML = html;

  // status
  let matched = planets.filter(p => p.rust_sect_rand_hm === p.sect_rand_hm).length;
  document.getElementById(`status-${id}`).textContent = `${matched}/${planets.length} match`;
}

// Load report
// Load mismatches
fetch('/api/mismatches').then(r=>r.json()).then(mm => {
  const el = document.getElementById('mismatches');
  if (!mm.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<h3>Mismatches</h3><table><tr><th>Star</th><th>Body</th><th>Type</th><th>Diff</th></tr>' +
    mm.map(m => `<tr><td>${m.star}</td><td>${m.body}</td><td>${m.type}</td><td style="font-size:.7rem">${m.diffs.join(', ')}</td></tr>`).join('') +
    '</table>';
});

fetch('/api/report').then(r=>r.json()).then(d => {
  const cards = [
    {n:d.sector_match+'/'+d.sector_total, l:'Sector match'},
    {n:d.stars, l:'Stars'},
    {n:d.surf_match+'/'+d.surf_total, l:'Surface match'},
    {n:d.atmo_match+'/'+d.surf_total, l:'Atmo match'},
    {n:d.pal_match+'/'+d.surf_total, l:'Palette match'},
  ];
  if (d.texture_total) {
    cards.push({n:d.sky_match+'/'+d.texture_total, l:'Sky match'});
    cards.push({n:d.surf_tex_match+'/'+d.texture_total, l:'Surf tex match'});
  }
  if (d.surf_unprocessed) {
    cards.push({n:d.surf_unprocessed, l:'Unprocessed'});
  }
  document.getElementById('report').innerHTML = cards.map(c =>
    `<div class="stat-card"><div class="num">${c.n}</div><div class="lbl">${c.l}</div></div>`
  ).join('');
});
</script>
</body>
</html>
