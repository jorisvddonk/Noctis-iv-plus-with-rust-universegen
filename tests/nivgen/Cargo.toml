[package]
name = "nivgen"
version = "0.1.0"
edition = "2021"
description = "Bug-for-bug Rust reimplementation of the Noctis IV Plus universe generator"
license = "MIT"

[dependencies]
extended = "0.1.0"
swfp = "0.1.0"

[lib]
name = "nivgen"
path = "src/lib.rs"

[[bin]]
name = "nivgen"
path = "src/main.rs"
